<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zone 3 Distance Monitor AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #debug-panel {
      position: fixed; top: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.85); color: #00ffcc; padding: 12px;
      border-radius: 8px; font-size: 12px; z-index: 9999; pointer-events: none;
      line-height: 1.5; font-family: monospace;
    }
    #warning-box {
      background: rgba(255, 69, 0, 0.9); color: white; padding: 6px;
      border-radius: 4px; margin-top: 6px; text-align: center; font-weight: bold;
      display: none;
    }
    #control-panel {
      position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9); padding: 10px; border-radius: 12px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; z-index: 9999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 92%; max-width: 350px;
    }
    .ctrl-btn {
      padding: 10px 5px; font-size: 12px; font-weight: bold; background: #0066cc;
      color: white; border: none; border-radius: 6px; text-align: center; cursor: pointer;
      pointer-events: auto;
    }
    .ctrl-btn:active { background: #004080; }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- デバッグ＆距離モニターパネル -->
  <div id="debug-panel">
    <b>【現地距離モニター（第3系）】</b><br>
    <span id="txt-gps">現在地GPS取得中...</span><br>
    <span id="txt-dist">目標までの距離: 計算中...</span>
    <div id="warning-box">⚠️ 現地から離れています（モデルは非表示）</div>
  </div>

  <!-- 微調整パネル -->
  <div id="control-panel">
    <button class="ctrl-btn" onclick="adjustPosition(0, 0, -0.5)">前進</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, 0.5, 0)">上 (+)</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, 0, 0.5)">後退</button>
    <button class="ctrl-btn" onclick="adjustPosition(-0.5, 0, 0)">左</button>
    <button class="ctrl-btn" onclick="adjustRotation(15)">回転 (+)</button>
    <button class="ctrl-btn" onclick="adjustPosition(0.5, 0, 0)">右</button>
    <button class="ctrl-btn" onclick="resetModel()">リセット</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, -0.5, 0)">下 (-)</button>
    <button class="ctrl-btn" onclick="adjustRotation(-15)">回転 (-)</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- Blender原点(0,0,0)あわせのモデル -->
    <a-entity
      id="ar-model"
      scale="1 1 1"
      rotation="0 0 0"
      position="0 0 -3">
      <a-gltf-model src="./model.glb" animation-mixer></a-gltf-model>
    </a-entity>

    <a-camera></a-camera>
  </a-scene>

  <script>
    // ─── 【ここに現地の平面直角座標（第3系）を入力】 ───
    const TARGET_SURVEY = {
      x: -215002, // 現地のX座標
      y: -32444  // 現地のY座標
    };

    // 第3系の原点定義
    const ZONE3_ORIGIN_LAT = 36.0;
    const ZONE3_ORIGIN_LON = 132.16666666666666;

    // 平面直角座標から緯度経度へ変換
    function planeRectToLatLng(x, y) {
      const mCos = Math.cos(ZONE3_ORIGIN_LAT * Math.PI / 180.0);
      return {
        latitude: ZONE3_ORIGIN_LAT + (x / 111132.92),
        longitude: ZONE3_ORIGIN_LON + (y / (111412.84 * mCos))
      };
    }

    const targetLatLng = planeRectToLatLng(TARGET_SURVEY.x, TARGET_SURVEY.y);

    // 2点間の距離（メートル）を算出するヒュベニの公式
    function calcDistanceMeters(lat1, lon1, lat2, lon2) {
      const radLat1 = lat1 * Math.PI / 180;
      const radLat2 = lat2 * Math.PI / 180;
      const radLon1 = lon1 * Math.PI / 180;
      const radLon2 = lon2 * Math.PI / 180;

      const latAvg = (radLat1 + radLat2) / 2.0;
      const meridionalRadius = 6335439 / Math.sqrt(Math.pow(1.0 - 0.00669438 * Math.sin(latAvg)*Math.sin(latAvg), 3));
      const primeVerticalRadius = 6378137 / Math.sqrt(1.0 - 0.00669438 * Math.sin(latAvg)*Math.sin(latAvg));

      const dLat = radLat1 - radLat2;
      const dLon = radLon1 - radLon2;

      const dy = dLat * meridionalRadius;
      const dx = dLon * primeVerticalRadius * Math.cos(latAvg);

      return Math.sqrt(dx * dx + dy * dy);
    }

    // GPSを監視して現地との距離をリアルタイム表示
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const curLat = position.coords.latitude;
          const curLng = position.coords.longitude;

          document.getElementById('txt-gps').innerHTML = 
            `現在地: 緯度${curLat.toFixed(5)}, 経度${curLng.toFixed(5)}`;

          const distance = calcDistanceMeters(curLat, curLng, targetLatLng.latitude, targetLatLng.longitude);
          
          const distText = distance >= 1000 ? (distance / 1000).toFixed(2) + " km" : Math.round(distance) + " m";
          document.getElementById('txt-dist').innerText = `目標までの距離: 約 ${distText}`;

          const warningBox = document.getElementById('warning-box');
          const modelEl = document.getElementById('ar-model');

          // 例: 50m以上離れている場合は警告を出し、遠隔テスト時はモデルを非表示にする（現場では閾値を変更可能）
          if (distance > 50) {
            warningBox.style.display = "block";
            warningBox.innerText = `⚠️ 現地から約${distText}離れています（遠隔テスト中）`;
            // 現場ではなくテスト中の場合はモデルを隠す、または手前に出すなどの制御が可能
          } else {
            warningBox.style.display = "none";
          }
        },
        (error) => {
          document.getElementById('txt-gps').innerText = `GPS取得エラー: ${error.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 0 }
      );
    }

    // 微調整スクリプト
    const modelEl = document.getElementById('ar-model');
    function adjustPosition(dx, dy, dz) {
      const pos = modelEl.getAttribute('position');
      modelEl.setAttribute('position', { x: pos.x + dx, y: pos.y + dy, z: pos.z + dz });
    }
    function adjustRotation(ddeg) {
      const rot = modelEl.getAttribute('rotation');
      modelEl.setAttribute('rotation', { x: rot.x, y: rot.y + ddeg, z: rot.z });
    }
    function resetModel() {
      modelEl.setAttribute('position', {x: 0, y: 0, z: -3});
      modelEl.setAttribute('rotation', {x: 0, y: 0, z: 0});
    }
  </script>
</body>
</html>
