<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Direct GPS Zone 3 AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #debug-panel {
      position: fixed; top: 10px; left: 10px; right: 10px;
      background: rgba(0,0,0,0.85); color: #00ffcc; padding: 12px;
      border-radius: 8px; font-size: 12px; z-index: 9999; pointer-events: none;
      line-height: 1.5; font-family: monospace;
    }
    #control-panel {
      position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9); padding: 10px; border-radius: 12px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; z-index: 9999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); width: 92%; max-width: 350px;
    }
    .ctrl-btn {
      padding: 10px 5px; font-size: 12px; font-weight: bold; background: #0066cc;
      color: white; border: none; border-radius: 6px; text-align: center; cursor: pointer;
      pointer-events: auto;
    }
    .ctrl-btn:active { background: #004080; }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- デバッグパネル -->
  <div id="debug-panel">
    <b>【GPS直接取得モニター】</b><br>
    <span id="txt-gps">GPS取得中... (屋外に出て下さい)</span><br>
    <span id="txt-target">目標(第3系): 計算完了</span><br>
    <span id="txt-status">状態: 待機中</span>
  </div>

  <!-- 微調整パネル -->
  <div id="control-panel">
    <button class="ctrl-btn" onclick="adjustPosition(0, 0, -0.5)">前進</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, 0.5, 0)">上</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, 0, 0.5)">後退</button>
    <button class="ctrl-btn" onclick="adjustPosition(-0.5, 0, 0)">左</button>
    <button class="ctrl-btn" onclick="adjustRotation(15)">回転</button>
    <button class="ctrl-btn" onclick="adjustPosition(0.5, 0, 0)">右</button>
    <button class="ctrl-btn" onclick="resetModel()">リセット</button>
    <button class="ctrl-btn" onclick="adjustPosition(0, -0.5, 0)">下</button>
    <button class="ctrl-btn" onclick="adjustRotation(-15)">反転</button>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- モデル配置用エンティティ -->
    <a-entity
      id="ar-model"
      scale="1 1 1"
      rotation="0 0 0"
      position="0 0 -3">
      <a-gltf-model src="./model.glb" animation-mixer></a-gltf-model>
    </a-entity>

    <a-camera-static />
  </a-scene>

  <script>
    // ─── 【ここに実際の第3系座標を入力】 ───
    const SURVEY_INPUT = {
      zone: 3,
      targetX: -32444,
      targetY: -215002
    };

    const ZONE_3_ORIGIN = { lat: 36.0, lon: 132.16666666666666 };

    function convertZone3ToLatLng(x, y) {
      const dLat = x / 111000.0;
      const dLng = y / (111000.0 * Math.cos(ZONE_3_ORIGIN.lat * Math.PI / 180.0));
      return {
        latitude: ZONE_3_ORIGIN.lat + dLat,
        longitude: ZONE_3_ORIGIN.lon + dLng
      };
    }

    const targetLatLng = convertZone3ToLatLng(SURVEY_INPUT.targetX, SURVEY_INPUT.targetY);
    document.getElementById('txt-target').innerText = 
      `目標(第3系): 緯度${targetLatLng.latitude.toFixed(5)}, 経度${targetLatLng.longitude.toFixed(5)}`;

    // JS標準機能で強制的にGPSを取得する
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const curLat = position.coords.latitude;
          const curLng = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          document.getElementById('txt-gps').innerHTML = 
            `スマホ現在地: 緯度${curLat.toFixed(5)}, 経度${curLng.toFixed(5)} <br>(精度: 約${Math.round(accuracy)}m)`;
          document.getElementById('txt-status').innerText = `状態: GPS取得成功！モデルを表示中`;
        },
        (error) => {
          document.getElementById('txt-gps').innerText = `GPS取得エラー: ${error.message}`;
          document.getElementById('txt-status').innerText = `状態: 位置情報を許可してください`;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    } else {
      document.getElementById('txt-gps').innerText = `このブラウザはGPS未対応です`;
    }

    // 微調整用
    const modelEl = document.getElementById('ar-model');
    function adjustPosition(dx, dy, dz) {
      const pos = modelEl.getAttribute('position');
      modelEl.setAttribute('position', { x: pos.x + dx, y: pos.y + dy, z: pos.z + dz });
    }
    function adjustRotation(ddeg) {
      const rot = modelEl.getAttribute('rotation');
      modelEl.setAttribute('rotation', { x: rot.x, y: rot.y + ddeg, z: rot.z });
    }
    function resetModel() {
      modelEl.setAttribute('position', {x: 0, y: 0, z: -3});
      modelEl.setAttribute('rotation', {x: 0, y: 0, z: 0});
    }
  </script>
</body>
</html>
